<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Pau | Portafolio Profesional</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #190426;
            --p-cream: #F6E5B1;
            --p-blue-light: #8DACDB;
            --p-orange: #F2AC57;
            --p-rose-trans: rgba(255, 182, 193, 0.4);
            --text-white: #FAF9F6;
            --star-color: #FFF4D2;
        }

        * { box-sizing: border-box; scroll-behavior: smooth; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-white);
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* --- ANIMACIÓN DE ASOMARSE --- */
        @keyframes peekMove {
            0%, 100% { transform: rotate(0deg) translate(0, 0); }
            50% { transform: rotate(5deg) translate(-10px, 10px); }
        }

        .canario-peek {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            width: 280px;
            height: auto;
            /* Aplicamos la animación */
            animation: peekMove 4s infinite ease-in-out;
        }

        /* --- HEADER (Canario 1) --- */
        header {
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 50px 10%;
            position: relative;
            z-index: 10;
        }

        /* Asomado desde la esquina superior derecha */
        .canario-uno {
            top: -40px;
            right: -60px; /* Escondido parcialmente */
            transform-origin: top right;
        }

        .perfil-container {
            width: 220px; height: 220px; border-radius: 50%; padding: 5px; 
            background: linear-gradient(135deg, var(--p-blue-light), var(--p-orange)); 
            margin-bottom: 25px;
            position: relative;
            z-index: 11;
        }
        .foto-perfil { 
            width: 100%; height: 100%; border-radius: 50%; 
            object-fit: cover; border: 4px solid var(--bg-deep); 
        }

        h1 { font-size: clamp(2.5rem, 6vw, 4rem); text-transform: uppercase; letter-spacing: 5px; margin-top: 20px; }
        .subtitulo { color: var(--p-orange); font-size: clamp(1.2rem, 2.5vw, 1.5rem); letter-spacing: 6px; margin: 25px 0; font-weight: 600; text-transform: uppercase; }

        /* --- PLANETAS --- */
        .planets-container {
            position: relative; 
            min-height: 180vh; 
            width: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        .planet-system { position: absolute; transition: transform 0.1s ease-out; }
        .planet-link {
            width: var(--size); height: var(--size); border-radius: 50%;
            text-decoration: none; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative; overflow: hidden;
        }
        .img-planeta-png { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        .p-industrial { --size: 300px; }
        .p-ux { --size: 280px; }
        .p-artesanal { --size: 220px; }
        .sys-industrial { left: 5%; top: 15%; }
        .sys-ux { right: 8%; top: 40%; }
        .sys-artesanal { left: 35%; bottom: 8%; }

        /* --- FOOTER (Canario 2) --- */
        .footer-contact { 
            background: #0d0216; 
            padding: 100px 10%; 
            text-align: center; 
            position: relative;
            z-index: 10; 
        }

        /* Asomado desde la esquina inferior izquierda */
        .canario-dos {
            bottom: -30px;
            left: -50px; /* Escondido parcialmente */
            transform-origin: bottom left;
            animation-delay: 1s; /* Desfase para que no se muevan igual */
        }

        .cv-button { padding: 14px 28px; border: 2px solid var(--p-blue-light); color: white; text-decoration: none; text-transform: uppercase; font-weight: 700; margin: 8px; display: inline-block; transition: 0.3s; }
        .cv-button:hover { background: var(--p-blue-light); color: var(--bg-deep); }
        .social-links { display: flex; justify-content: center; gap: 40px; margin: 40px 0; }
        .social-links a { color: var(--p-blue-light); font-size: 2rem; }
        .copyright { opacity: 0.4; font-size: 0.7rem; margin-top: 20px; }

        /* Estrellas */
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { position: absolute; background: var(--star-color); border-radius: 50%; opacity: 0.6; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
    </style>
</head>
<body>

    <div class="stars-container" id="starField"></div>

    <header>
        <img src="CANARIO1.PNG" alt="Canario" class="canario-peek canario-uno">
        
        <div class="perfil-container">
            <img src="perfil.PNG" alt="Ana Pau" class="foto-perfil">
        </div>
        <h1>Ana Pau</h1>
        <p class="subtitulo">Diseñadora Industrial & UX</p>
    </header>

    <main class="planets-container">
        <section class="planet-system sys-industrial" data-depth="0.05">
            <a href="#" class="planet-link p-industrial">
                <img src="PLANETA1.PNG" class="img-planeta-png">
                <span>Industrial</span>
            </a>
        </section>
        <section class="planet-system sys-artesanal" data-depth="0.12">
            <a href="#" class="planet-link p-artesanal">
                <img src="PLANETA2.PNG" class="img-planeta-png">
                <span>Artesanía</span>
            </a>
        </section>
        <section class="planet-system sys-ux" data-depth="0.08">
            <a href="#" class="planet-link p-ux">
                <img src="PLANETA3.PNG" class="img-planeta-png">
                <span>Diseño UX</span>
            </a>
        </section>
    </main>

    <footer class="footer-contact">
        <img src="CANARIO2.PNG" alt="Canario" class="canario-peek canario-dos">

        <a href="#" class="cv-button">CV Industrial</a>
        <a href="#" class="cv-button">CV UX</a>
        
        <div class="social-links">
            <a href="#"><i class="fab fa-whatsapp"></i></a>
            <a href="#"><i class="fab fa-linkedin-in"></i></a>
            <a href="#"><i class="fab fa-behance"></i></a>
        </div>
        <p class="copyright">© 2026 ANA PAU • MÉXICO</p>
    </footer>

    <script>
        const starField = document.getElementById('starField');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 'px';
            star.style.width = size; star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starField.appendChild(star);
        }

        document.addEventListener('mousemove', (e) => {
            const systems = document.querySelectorAll('.planet-system');
            systems.forEach(sys => {
                const depth = parseFloat(sys.getAttribute('data-depth'));
                const x = (window.innerWidth / 2 - e.clientX) * depth;
                const y = (window.innerHeight / 2 - e.clientY) * depth;
                sys.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
